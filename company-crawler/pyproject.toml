[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "company-crawler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "annotated-types>=0.8.0",
    "attrs>=26.1.0",
    "babel>=2.18.0",
    "beautifulsoup4>=4.15.0",
    "behave>=1.2.6",
    "certifi>=2026.7.22",
    "cffi>=2.1.1",
    "charset-normalizer>=3.5.1",
    "colorama>=0.4.6",
    "company-common",
    "cssselect>=1.5.0",
    "curl-cffi>=0.16.2",
    "diskcache>=5.6.3",
    "exceptiongroup>=1.3.1",
    "execnet>=2.1.2",
    "fake-headers>=1.0.2",
    "fasteners>=0.20",
    "filelock>=3.32.4",
    "h11>=0.16.0",
    "idna>=3.19",
    "iniconfig>=2.3.0",
    "jinja2>=3.1.6",
    "js2py>=0.74",
    "markdown-it-py>=4.2.0",
    "markupsafe>=3.0.3",
    "mdurl>=0.1.2",
    "mouseinfo>=0.1.3",
    "mycdp>=1.4.0",
    "outcome>=1.3.0.post0",
    "packaging>=26.3",
    "parameterized>=0.9.0",
    "parse>=1.22.1",
    "parse-type>=0.6.6",
    "pdbp>=1.8.2",
    "platformdirs>=4.11.5",
    "pluggy>=1.6.0",
    "price-parser>=0.5.1",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.2.3",
    "pyautogui>=0.9.54",
    "pycparser>=3.0",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "pydantic-settings>=2.15.0",
    "pygetwindow>=0.0.9",
    "pygments>=2.21.0",
    "pyjsparser>=2.7.1",
    "pymongo>=4.17.0",
    "pymsgbox>=2.0.1",
    "pynose>=1.5.5",
    "pyotp>=2.10.0",
    "pyperclip>=1.11.0",
    "pyrect>=0.2.0",
    "pyscreeze>=1.0.1",
    "pysocks>=1.7.1",
    "pytest>=9.1.1",
    "pytest-html>=4.0.2",
    "pytest-metadata>=3.1.1",
    "pytest-ordering>=0.6",
    "pytest-rerunfailures>=16.6",
    "pytest-xdist>=3.8.0",
    "python-dateutil>=2.9.0.post0",
    "python-xlib>=0.33",
    "python3-xlib>=0.15",
    "pytweening>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "requests-file>=3.0.1",
    "rich>=15.0.0",
    "sbvirtualdisplay>=1.4.0",
    "selenium>=4.48.0",
    "seleniumbase>=4.53.0",
    "setuptools>=84.0.0",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "sortedcontainers>=2.4.0",
    "soupsieve>=2.9.2",
    "tabcompleter>=1.4.1",
    "tldextract>=5.3.2",
    "trio>=0.34.0",
    "trio-websocket>=0.12.2",
    "typing-extensions>=4.16.0",
    "typing-inspection>=0.4.4",
    "tzlocal>=5.4.4",
    "urllib3>=2.7.0",
    "websocket-client>=1.9.1",
    "websockets>=17.1",
    "wheel>=0.48.0",
    "wsproto>=1.3.2",
]

[tool.uv.sources]
company-common = { path = "../company-common", editable = true }

[tool.setuptools]
packages = [
    "company_crawler",
    "base",
    "craft",
    "craft.crawlers",
    "craft.parsers",
    "craft.searchers",
    "craft.services",
    "craft.utils",
    "global_utils",
    "interfaces",
    "storage",
    "tests",
]

# The project directory is named "company-crawler" (hyphen), so map the
# importable root package name "company_crawler" onto the project root to make
# "from company_crawler import ..." work as documented in the README.
[tool.setuptools.package-dir]
company_crawler = "."
